<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>牛马食堂 - 拯救打工人的选择困难症</title>
  <style>
    :root {
      --bg-1: #1a1423;
      --bg-2: #2d1b2e;
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #FF6B35;
      --primary-light: #FF9F1C;
      --accent: #FFD93D;
      --success: #6BCB77;
      --text: #f0ece4;
      --text-muted: #8a8580;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
      overflow-x: hidden;
    }

    /* 背景装饰 */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      right: -10%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(255, 107, 53, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(255, 217, 61, 0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      padding: 24px 20px 40px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 头部 */
    .header {
      text-align: center;
      margin-bottom: 28px;
      width: 100%;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .header .subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* 主显示区 */
    .display-area {
      width: 100%;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      position: relative;
    }

    /* 空闲状态 */
    .idle-state {
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    .idle-emoji {
      font-size: 64px;
      margin-bottom: 16px;
      display: inline-block;
      animation: bounce 2s ease-in-out infinite;
    }

    .idle-text {
      font-size: 16px;
      color: var(--text-muted);
      line-height: 1.8;
    }

    .idle-text strong {
      color: var(--accent);
    }

    /* 抽取动画区 */
    .spinning-state {
      text-align: center;
      width: 100%;
    }

    .spin-display {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: var(--radius);
      padding: 32px 24px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .spin-display::before,
    .spin-display::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 40px;
      pointer-events: none;
      z-index: 2;
    }

    .spin-display::before {
      top: 0;
      background: linear-gradient(to bottom, var(--bg-2), transparent);
    }

    .spin-display::after {
      bottom: 0;
      background: linear-gradient(to top, var(--bg-2), transparent);
    }

    .spin-name {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary-light);
      transition: opacity 0.05s ease;
    }

    .spin-hint {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 12px;
    }

    /* 结果卡片 */
    .result-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .result-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--accent), var(--primary));
      background-size: 200% 100%;
      animation: shimmer 2s linear infinite;
    }

    .result-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(255, 107, 53, 0.15);
      color: var(--primary-light);
      font-size: 12px;
      font-weight: 600;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .result-name {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 4px;
      color: var(--text);
    }

    .result-category {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .result-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .info-icon {
      font-size: 18px;
      flex-shrink: 0;
    }

    .info-label {
      color: var(--text-muted);
      font-size: 12px;
    }

    .info-value {
      color: var(--text);
      font-weight: 600;
    }

    .result-note {
      background: rgba(255, 217, 61, 0.08);
      border-left: 3px solid var(--accent);
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
      font-size: 13px;
      color: var(--text);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .result-quote {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
      padding: 8px 0;
    }

    .result-actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .btn-action {
      flex: 1;
      padding: 12px 0;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-confirm {
      background: linear-gradient(135deg, var(--success) 0%, #4daf50  100%);
      color: #fff;
    }

    .btn-confirm:active {
      transform: scale(0.96);
    }

    .btn-reroll {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--card-border);
    }

    .btn-reroll:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.1);
    }

    /* 主按钮 */
    .pick-button {
      width: 100%;
      padding: 18px 0;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 20px rgba(255, 107, 53, 0.35);
      letter-spacing: 2px;
      position: relative;
      overflow: hidden;
    }

    .pick-button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.4s ease, height 0.4s ease;
    }

    .pick-button:active::before {
      width: 300px;
      height: 300px;
    }

    .pick-button:active {
      transform: scale(0.97);
      box-shadow: 0 3px 10px rgba(255, 107, 53, 0.25);
    }

    .pick-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .pick-button .dice {
      display: inline-block;
      margin-right: 6px;
      animation: diceRoll 0.6s ease-in-out;
    }

    /* 今日历史 */
    .history-section {
      width: 100%;
      margin-top: 28px;
    }

    .history-title {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .history-item {
      padding: 6px 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      animation: fadeIn 0.3s ease;
    }

    .history-item .h-time {
      font-size: 10px;
      opacity: 0.6;
    }

    .history-empty {
      font-size: 12px;
      color: var(--text-muted);
      opacity: 0.5;
    }

    /* 底部信息 */
    .footer {
      margin-top: 32px;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.5;
      line-height: 1.6;
    }

    .footer a {
      color: var(--primary-light);
      text-decoration: none;
    }

    /* 数据源标识 */
    .data-source {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .data-source .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s ease-in-out infinite;
    }

    /* 动画 */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @keyframes diceRoll {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.2); }
      100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(-10px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(300px) rotate(360deg);
        opacity: 0;
      }
    }

    .confetti {
      position: absolute;
      width: 8px;
      height: 8px;
      pointer-events: none;
      animation: confettiFall 1.5s ease-out forwards;
    }

    /* 已确认状态 */
    .confirmed-banner {
      text-align: center;
      padding: 16px;
      background: rgba(107, 203, 119, 0.1);
      border: 1px solid rgba(107, 203, 119, 0.2);
      border-radius: 14px;
      animation: slideUp 0.4s ease;
      width: 100%;
    }

    .confirmed-banner .emoji {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .confirmed-banner .text {
      font-size: 15px;
      color: var(--success);
      font-weight: 600;
    }

    .confirmed-banner .sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 头部 -->
    <div class="header">
      <h1>🐮 牛马食堂</h1>
      <p class="subtitle">拯救打工人的选择困难症</p>
      <div class="data-source">
        <span class="dot"></span>
        <span id="dataSourceText">数据源：飞书多维表格</span>
      </div>
    </div>

    <!-- 主显示区 -->
    <div class="display-area" id="displayArea">
      <div class="idle-state" id="idleState">
        <div class="idle-emoji">🤔</div>
        <div class="idle-text">
          又不知道<strong>吃啥</strong>了？<br>
          按下按钮，命运为你做主
        </div>
      </div>
    </div>

    <!-- 抽取按钮 -->
    <button class="pick-button" id="pickButton" onclick="startPick()">
      <span class="dice">🎲</span>随机抽取
    </button>

    <!-- 今日历史 -->
    <div class="history-section">
      <div class="history-title">📋 今日已选</div>
      <div class="history-list" id="historyList">
        <span class="history-empty">还没有记录，快抽一个吧</span>
      </div>
    </div>

    <!-- 底部 -->
    <div class="footer">
      数据来自飞书表格 · 每日更新<br>
      牛马食堂 v1.0 · 打工人的精神食粮
    </div>
  </div>

  <script>
    // ========================================
    // 数据层 - 对接飞书表格
    // ========================================
    // 飞书表格列结构说明：
    // | 餐厅名称 | 类型 | 分类 | 人均价格 | 距离 | 地址 | 备注 |
    // | name    | type | category | price | distance | address | note |
    //
    // 类型字段：food(吃饭) / drink(喝的)
    // 
    // 对接方式：
    // 1. 在飞书连接器中连接飞书账号
    // 2. 通过飞书 API 读取表格数据
    // 3. 将返回数据赋值给 RESTAURANT_DATA
    // ========================================

    const RESTAURANT_DATA = [
      { name: "杨国福", type: "food", category: "麻辣烫", price: "", distance: "", address: "", note: "" },
      { name: "长沙粉", type: "food", category: "粉", price: "", distance: "", address: "", note: "" },
      { name: "陕壹哥", type: "food", category: "面、饭", price: "", distance: "", address: "", note: "" },
      { name: "喜➕德", type: "food", category: "水饺", price: "", distance: "", address: "", note: "" },
      { name: "福记", type: "food", category: "盖饭", price: "", distance: "", address: "", note: "" },
      { name: "港式茶餐厅", type: "food", category: "炒菜", price: "", distance: "", address: "", note: "" },
    ];

    // 牛马语录
    const QUOTES = [
      "吃饱了才有力气搬砖 💪",
      "这顿饭是对自己最好的犒劳",
      "打工人的快乐就是这么简单",
      "吃好喝好，长生不老",
      "今天的你，值得这一顿",
      "选都选了，别纠结了，快去吃",
      "民以食为天，打工人以饭为命",
      "干饭不积极，思想有问题",
      "人生苦短，先把午饭吃了",
      "没有什么是一顿饭解决不了的",
      "工作再忙，也要好好吃饭",
      "今天也是元气满满（并不）的一天",
    ];

    // ========================================
    // 应用状态
    // ========================================
    let isSpinning = false;
    let currentResult = null;
    let history = []; // 今日历史 [{name, type, time}]
    let lastResultIndex = -1; // 上次结果索引，避免连续抽到同一个

    // ========================================
    // 重置到空闲状态
    // ========================================
    function resetToIdle() {
      const displayArea = document.getElementById('displayArea');
      displayArea.innerHTML = `
        <div class="idle-state">
          <div class="idle-emoji">🤔</div>
          <div class="idle-text">
            又不知道<strong>吃啥</strong>了？<br>
            按下按钮，命运为你做主
          </div>
        </div>
      `;
      currentResult = null;
    }

    // ========================================
    // 随机选取（避免连续相同）
    // ========================================
    function getRandomItem(data) {
      const candidates = data.filter((_, i) => i !== lastResultIndex);
      const idx = Math.floor(Math.random() * candidates.length);
      const originalIdx = data.indexOf(candidates[idx]);
      lastResultIndex = originalIdx;
      return candidates[idx];
    }

    // ========================================
    // 开始抽取
    // ========================================
    function startPick() {
      if (isSpinning) return;
      
      const candidates = RESTAURANT_DATA;
      if (candidates.length === 0) return;

      isSpinning = true;
      const button = document.getElementById('pickButton');
      button.disabled = true;

      // 显示滚动动画
      const displayArea = document.getElementById('displayArea');
      displayArea.innerHTML = `
        <div class="spinning-state">
          <div class="spin-display">
            <div class="spin-name" id="spinName">准备中...</div>
          </div>
          <div class="spin-hint">命运正在降临...</div>
        </div>
      `;

      // 动画：快速循环显示名字，逐渐减速
      const spinName = document.getElementById('spinName');
      let count = 0;
      const totalCycles = 28;
      let speed = 50;

      const animate = () => {
        if (count < totalCycles) {
          const random = candidates[Math.floor(Math.random() * candidates.length)];
          spinName.textContent = random.name;
          count++;
          // 逐渐减速
          speed = 50 + Math.pow(count / totalCycles, 2) * 200;
          setTimeout(animate, speed);
        } else {
          // 最终结果
          const result = getRandomItem(candidates);
          showResult(result);
          isSpinning = false;
          button.disabled = false;
        }
      };

      animate();
    }

    // ========================================
    // 显示结果
    // ========================================
    function showResult(item) {
      currentResult = item;
      const displayArea = document.getElementById('displayArea');
      const quote = QUOTES[Math.floor(Math.random() * QUOTES.length)];

      // 构建信息项（跳过空字段）
      const infoItems = [];
      if (item.price) infoItems.push(`<div class="info-item"><span class="info-icon">💰</span><div><div class="info-label">人均</div><div class="info-value">¥${item.price}</div></div></div>`);
      if (item.distance) infoItems.push(`<div class="info-item"><span class="info-icon">📍</span><div><div class="info-label">距离</div><div class="info-value">${item.distance}</div></div></div>`);
      if (item.address) infoItems.push(`<div class="info-item" style="grid-column: 1 / -1;"><span class="info-icon">🏠</span><div><div class="info-label">地址</div><div class="info-value">${item.address}</div></div></div>`);

      displayArea.innerHTML = `
        <div class="result-card" id="resultCard">
          <span class="result-badge">🍽️ 今日吃这个</span>
          <div class="result-name">${item.name}</div>
          <div class="result-category">${item.category}</div>
          ${infoItems.length > 0 ? `<div class="result-info">${infoItems.join('')}</div>` : ''}
          ${item.note ? `<div class="result-note">💡 ${item.note}</div>` : ''}
          <div class="result-quote">"${quote}"</div>
          <div class="result-actions">
            <button class="btn-action btn-confirm" onclick="confirmPick()">✅ 就这个了</button>
            <button class="btn-action btn-reroll" onclick="startPick()">🔄 换一个</button>
          </div>
        </div>
      `;

      // 撒花效果
      createConfetti();
    }

    // ========================================
    // 确认选择
    // ========================================
    function confirmPick() {
      if (!currentResult) return;
      
      // 记录到历史
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      history.unshift({
        name: currentResult.name,
        type: currentResult.type,
        time: timeStr
      });
      updateHistory();

      // 显示确认 banner
      const displayArea = document.getElementById('displayArea');
      displayArea.innerHTML = `
        <div class="confirmed-banner">
          <div class="emoji">🎉</div>
          <div class="text">就决定是「${currentResult.name}」了！</div>
          <div class="sub">快去吧，别让肚子等急了</div>
        </div>
      `;

      // 再次撒花
      createConfetti();
    }

    // ========================================
    // 更新历史记录
    // ========================================
    function updateHistory() {
      const list = document.getElementById('historyList');
      if (history.length === 0) {
        list.innerHTML = '<span class="history-empty">还没有记录，快抽一个吧</span>';
        return;
      }
      list.innerHTML = history.map(h => `
        <div class="history-item">
          <span>🍽️ ${h.name}</span>
          <span class="h-time">${h.time}</span>
        </div>
      `).join('');
    }

    // ========================================
    // 撒花效果
    // ========================================
    function createConfetti() {
      const colors = ['#FF6B35', '#FFD93D', '#6BCB77', '#FF9F1C', '#f0ece4'];
      const displayArea = document.getElementById('displayArea');
      
      for (let i = 0; i < 12; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.top = '0px';
        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        confetti.style.animationDelay = Math.random() * 0.3 + 's';
        confetti.style.animationDuration = (1 + Math.random()) + 's';
        displayArea.appendChild(confetti);
        
        setTimeout(() => confetti.remove(), 2500);
      }
    }
